<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <div class="container auth-container">

    <h1>Create Account</h1>

    <div
      class="form"
      autocomplete="off"
    >

      <input
        type="text"
        id="name"
        placeholder="Name"
        autocomplete="off"
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="off"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="new-password"
      >

      <button id="registerBtn">
        Register
      </button>

      <p id="error"></p>

      <p class="auth-link">

        Already have account?

        <a href="login.html">
          Login
        </a>

      </p>

    </div>

  </div>

  <script>

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(() => {

    toast.classList.remove(
      "show"
    );

  }, 2500);

}

const BASE_URL =
  "https://splitledger-backend-u7lw.onrender.com/auth";

document
  .getElementById("registerBtn")
  .addEventListener(
    "click",
    async () => {

      const name =
        document
          .getElementById("name")
          .value;

      const email =
        document
          .getElementById("email")
          .value;

      const password =
        document
          .getElementById("password")
          .value;

      const error =
        document
          .getElementById("error");

      if (
        !name ||
        !email ||
        !password
      ) {

        error.textContent =
          "All fields required";

        return;

      }

      try {

        const response =
          await fetch(

            `${BASE_URL}/register`,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body: JSON.stringify({

                name,

                email,

                password

              })

            }

          );

        const data =
          await response.json();

        if (!response.ok) {

          error.textContent =
            data.message;

          return;

        }

        showToast(
          "Registration successful 🎉"
        );

        setTimeout(() => {

          window.location.href =
            "login.html";

        }, 1200);

      }

      catch (err) {

        error.textContent =
          "Something went wrong";

      }

});

  </script>

  <div id="toast"></div>

</body>

</html>
